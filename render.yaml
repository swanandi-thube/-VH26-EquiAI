# Render Blueprint for ADAPTIVECACHE Platform
# Documentation: https://render.com/docs/blueprint-spec

services:
  # -------------------------------------------------------------
  # Unified Web Service (Backend API + Static Frontend Hosting)
  # -------------------------------------------------------------
  - type: web
    name: adaptivecache-service
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CORS_ORIGIN
        value: "*"
      # Connect to Supabase Managed PostgreSQL
      - key: DATABASE_URL
        sync: false
      # Connect to Production Redis Provider (e.g. Upstash / Redis Cloud)
      - key: REDIS_URL
        sync: false
      - key: LOG_LEVEL
        value: info
      - key: DEFAULT_TTL_SECONDS
        value: 300
      - key: MAX_CACHE_CAPACITY_BYTES
        value: 67108864
